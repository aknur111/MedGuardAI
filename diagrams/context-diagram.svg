<text x="270.0" y="977.0" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">RxNorm / RxNav</text>
<text x="270.0" y="999.0" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">[NLM API]</text>
<text x="270.0" y="1028.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">Standard drug names and</text>
<text x="270.0" y="1051.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">ingredients</text>
<rect x="515.0" y="930" width="330" height="150" rx="10" fill="#8C96A3" stroke="#6B7480" stroke-width="2"/>
<text x="680.0" y="977.0" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">openFDA Drug Label</text>
<text x="680.0" y="999.0" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">[FDA API]</text>
<text x="680.0" y="1028.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">Contraindications, warnings,</text>
<text x="680.0" y="1051.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">interactions</text>
<rect x="925.0" y="930" width="330" height="150" rx="10" fill="#8C96A3" stroke="#6B7480" stroke-width="2"/>
<text x="1090.0" y="988.5" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">DailyMed</text>
<text x="1090.0" y="1010.5" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">[NLM]</text>
<text x="1090.0" y="1039.5" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">Official label (SPL) text</text>
<rect x="1335.0" y="930" width="330" height="150" rx="10" fill="#8C96A3" stroke="#6B7480" stroke-width="2"/>
<text x="1500.0" y="977.0" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">DDInter 2.0</text>
<text x="1500.0" y="999.0" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">[Open DDI database]</text>
<text x="1500.0" y="1028.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">Interaction, drug–disease,</text>
<text x="1500.0" y="1051.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">duplication records</text>
<text x="490.0" y="381.0" text-anchor="middle" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">Creates profile, writes own</text>
<text x="490.0" y="401.0" text-anchor="middle" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">history, books appointments</text>
<text x="490.0" y="421.0" text-anchor="middle" font-size="15" font-weight="400" fill="#5A6472" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">[HTTPS]</text>
<text x="900.0" y="387.0" text-anchor="middle" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">Publishes free slots, reviews history,</text>
<text x="900.0" y="407.0" text-anchor="middle" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">checks prescriptions, approves schedules</text>
<text x="900.0" y="427.0" text-anchor="middle" font-size="15" font-weight="400" fill="#5A6472" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">[HTTPS]</text>
<text x="1380.0" y="381.0" text-anchor="middle" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">Views clinics, doctors, login</text>
<text x="1380.0" y="401.0" text-anchor="middle" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">and event journals</text>
<text x="1380.0" y="421.0" text-anchor="middle" font-size="15" font-weight="400" fill="#5A6472" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">[HTTPS]</text>
<text x="540.0" y="562.0" text-anchor="middle" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">Sends</text>
<text x="540.0" y="582.0" text-anchor="middle" font-size="15" font-weight="400" fill="#5A6472" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">[Bot API]</text>
<text x="316.0" y="406.0" text-anchor="end" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">Reminders,</text>
<text x="316.0" y="426.0" text-anchor="end" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">questionnaire, chat</text>
<text x="403.5" y="822.0" text-anchor="middle" font-size="17" font-weight="600" fill="#2E3A48" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">Normalises drug names</text>
<text x="403.5" y="842.0" text-anchor="middle" font-size="15" font-weight="400" fill="#5A6472" paint-order="stroke" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">[REST / JSON, cached]</text>
