<text x="330.0" y="238.0" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">[Person]</text>
<text x="330.0" y="267.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">Keeps own history, books</text>
<text x="330.0" y="290.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">visits, follows the schedule</text>
<circle cx="900.0" cy="154" r="34" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
<rect x="750.0" y="178" width="300" height="132" rx="28" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
<text x="900.0" y="227.5" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Doctor</text>
<text x="900.0" y="249.5" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">[Person]</text>
<text x="900.0" y="278.5" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">Clinic doctor of any specialty</text>
<circle cx="1470.0" cy="154" r="34" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
<rect x="1320.0" y="178" width="300" height="132" rx="28" fill="#08427B" stroke="#073B6F" stroke-width="2"/>
<text x="1470.0" y="216.0" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Administrator</text>
<text x="1470.0" y="238.0" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">[Person]</text>
<text x="1470.0" y="267.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">Observes usage; no access to</text>
<text x="1470.0" y="290.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">personal data</text>
<rect x="600" y="500" width="600" height="210" rx="10" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
<text x="900.0" y="565.5" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">MedGuard</text>
<text x="900.0" y="587.5" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">[Software System]</text>
<text x="900.0" y="616.5" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">Web application: patient history, appointment booking,</text>
<text x="900.0" y="639.5" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">medication safety check with sources, intake schedule and</text>
<text x="900.0" y="662.5" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">reminders</text>
<rect x="180" y="520" width="300" height="170" rx="10" fill="#8C96A3" stroke="#6B7480" stroke-width="2"/>
<text x="330.0" y="577.0" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Telegram Bot API</text>
<text x="330.0" y="599.0" text-anchor="middle" font-size="16" font-weight="400" fill="#FFFFFF">[External system]</text>
<text x="330.0" y="628.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">Delivers reminders,</text>
<text x="330.0" y="651.0" text-anchor="middle" font-size="17" font-weight="400" fill="#FFFFFF">questionnaire and bot replies</text>
